<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godspeed Vault — Trading Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800;0,900;1,800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
        }

        /* Gloss sweep animation */
        @keyframes shine {
            0%   { transform: translateX(-150%) skewX(-15deg); }
            50%  { transform: translateX(150%)  skewX(-15deg); }
            100% { transform: translateX(150%)  skewX(-15deg); }
        }
        .gloss-animate {
            animation: shine 3s infinite linear;
        }

        /* 3D flip */
        .perspective-1000  { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden   { backface-visibility: hidden; }
        .rotate-y-180      { transform: rotateY(180deg); }
        .is-flipped .card-inner { transform: rotateY(180deg); }

        /* Subtle float */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-8px); }
        }
        .card-container { animation: float 5s ease-in-out infinite; }
        .card-container:hover { animation-play-state: paused; }
    </style>
</head>

<body class="flex flex-col items-center min-h-screen p-8 bg-[#050505]">

    <!-- Header -->
    <div class="mb-12 text-center">
        <h1 class="text-4xl font-black text-white uppercase tracking-tighter mb-2">
            GODSPEED <span class="text-[#4cc9f0]">VAULT</span>
        </h1>
        <p class="text-gray-500 text-sm">Tap a card to flip. Click 'Download' to save.</p>
    </div>

    <!-- Cards Grid -->
    <div id="cards-grid" class="flex flex-wrap justify-center gap-12 w-full max-w-7xl">
        <!-- Injected via JS -->
    </div>

    <script>
        const playerList = [
            {
                id: 'quest',
                name: 'Quest',
                lastname: 'Scott',
                image: 'src/assets/athletes/quest_scott_monster.png',
                number: '4',
                stats: {
                    s1: '5.0',  l1: 'PPG',
                    s2: '3.0',  l2: 'SPG',
                    s3: '4.0',  l3: 'DPG',
                    s4: '8.8',  l4: 'GRD'
                },
                games: [
                    { opp: 'vs. Weeks',   stat: '5 PTS, 3 STL' },
                    { opp: '@ Practice', stat: 'High Motor' },
                    { opp: 'Trend',      stat: 'Rising' }
                ]
            },
            {
                id: 'ashton',
                name: 'Ashton',
                lastname: 'Bowman',
                image: 'src/assets/athletes/ashton_comic.jpg',
                number: '2',
                stats: {
                    s1: '3.0',  l1: 'PPG',
                    s2: '1.0',  l2: 'STL',
                    s3: '1.0',  l3: 'REB',
                    s4: '7.6',  l4: 'GRD'
                },
                games: [
                    { opp: 'vs. Weeks',    stat: '3 PTS, 100% FT' },
                    { opp: '@ Practice 5', stat: 'Defensive Anchor' },
                    { opp: 'Trend',        stat: 'Steady Growth' }
                ]
            },
            {
                id: 'anton',
                name: 'Anton',
                lastname: 'Blyakhman',
                image: 'src/assets/athletes/anton_mythic_art.png',
                number: '12',
                stats: {
                    s1: '5.5',  l1: 'PPG',
                    s2: '1.5',  l2: 'APG',
                    s3: '1.5',  l3: 'SPG',
                    s4: '8.2',  l4: 'GRD'
                },
                games: [
                    { opp: 'Game 1', stat: '7 PTS, 2 AST, 1 STL' },
                    { opp: 'Game 2', stat: '4 PTS, 1 AST, 2 STL' },
                    { opp: 'Trend',  stat: 'Floor General' }
                ]
            },
            {
                id: 'ad-tuiono',
                name: 'A.D.',
                lastname: 'Tuiono',
                image: 'src/assets/athletes/ad_tuiono_99.png',
                number: '99',
                stats: {
                    s1: '—',  l1: 'PPG',
                    s2: '—',  l2: 'APG',
                    s3: '—',  l3: 'REB',
                    s4: '—',  l4: 'GRD'
                },
                games: [
                    { opp: 'vs. TBD', stat: '— PTS' },
                    { opp: '@ TBD',   stat: '— PTS' },
                    { opp: 'Trend',   stat: 'Rising' }
                ]
            }
        ];

        function renderCards() {
            const grid = document.getElementById('cards-grid');
            let html = '';

            playerList.forEach(p => {
                html += `
                <div class="card-container relative w-[320px] h-[450px] group perspective-1000 cursor-pointer"
                     onclick="this.classList.toggle('is-flipped')">
                    <div id="card-inner-${p.id}"
                         class="card-inner relative w-full h-full transition-transform duration-700 transform-style-3d shadow-2xl rounded-xl">

                        <!-- ═══ FRONT ═══ -->
                        <div class="absolute inset-0 w-full h-full backface-hidden bg-black rounded-xl overflow-hidden border border-white/20">

                            <!-- Player art -->
                            <div class="absolute inset-0 z-0">
                                <img src="${p.image}"
                                     class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 group-hover:rotate-1"
                                     style="object-position: center 0%;">
                            </div>

                            <!-- Bottom gradient -->
                            <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black via-black/80 to-transparent z-0"></div>

                            <!-- Content layer -->
                            <div class="relative z-10 flex flex-col h-full p-4 justify-between">

                                <!-- Top row: badge + number -->
                                <div class="flex justify-between items-start">
                                    <div class="bg-black/40 backdrop-blur-xl border border-white/20 rounded-lg px-3 py-1.5 shadow-[0_0_15px_rgba(76,201,240,0.3)]">
                                        <div class="text-[9px] font-black tracking-[0.25em] text-[#4cc9f0] uppercase mb-0.5">Godspeed</div>
                                        <div class="text-[10px] font-bold text-white uppercase tracking-wider">Mythic</div>
                                    </div>
                                    <div class="text-6xl font-black italic text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400"
                                         style="font-family:'Impact',sans-serif; -webkit-text-stroke:1px rgba(255,255,255,0.3);">
                                        ${p.number}
                                    </div>
                                </div>

                                <!-- Bottom: Name + flip hint -->
                                <div class="mt-auto relative z-20">
                                    <div class="absolute -top-12 right-0 w-24 h-24 bg-purple-500 rounded-full blur-[60px] opacity-20 mix-blend-color-dodge"></div>
                                    <div class="relative z-10 mb-2">
                                        <h2 class="text-4xl font-black text-white uppercase tracking-tighter leading-[0.85] italic transform -skew-x-6 drop-shadow-[0_4px_4px_rgba(0,0,0,1)]">
                                            ${p.name}<br>
                                            <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#4cc9f0] to-[#f72585]">
                                                ${p.lastname}
                                            </span>
                                        </h2>
                                    </div>
                                    <div class="text-center mt-4">
                                        <span class="text-[9px] font-bold text-white/50 uppercase tracking-widest border border-white/10 px-3 py-1 rounded-full backdrop-blur-md flex items-center justify-center gap-2">
                                            <span>↺</span> Flip for Stats
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- Gloss sweep -->
                            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/20 to-transparent w-[200%] h-full -translate-x-[150%] skew-x-12 gloss-animate pointer-events-none z-20"></div>
                            <!-- Border overlay -->
                            <div class="absolute inset-0 border-[2px] border-white/20 rounded-xl pointer-events-none z-30"></div>
                        </div>

                        <!-- ═══ BACK ═══ -->
                        <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-black rounded-xl overflow-hidden border border-white/20 p-5 flex flex-col">
                            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-30"></div>
                            <div class="absolute inset-0 bg-gradient-to-br from-[#0a0a0a] to-[#111] -z-10"></div>

                            <div class="relative z-10 flex flex-col h-full">

                                <!-- Back header -->
                                <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                                    <div class="text-xl font-black text-white italic uppercase">Season Stats</div>
                                    <div class="text-[#4cc9f0] text-xs font-bold tracking-widest">2024-25</div>
                                </div>

                                <!-- Stat grid -->
                                <div class="grid grid-cols-2 gap-4 mb-6">
                                    <div class="bg-white/5 rounded-lg p-3 text-center border border-white/5">
                                        <div class="text-3xl font-black text-white">${p.stats.s1}</div>
                                        <div class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">${p.stats.l1}</div>
                                    </div>
                                    <div class="bg-white/5 rounded-lg p-3 text-center border border-white/5">
                                        <div class="text-3xl font-black text-white">${p.stats.s2}</div>
                                        <div class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">${p.stats.l2}</div>
                                    </div>
                                    <div class="bg-white/5 rounded-lg p-3 text-center border border-white/5">
                                        <div class="text-3xl font-black text-white">${p.stats.s3}</div>
                                        <div class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">${p.stats.l3}</div>
                                    </div>
                                    <div class="bg-white/5 rounded-lg p-3 text-center border border-white/5">
                                        <div class="text-3xl font-black text-white">${p.stats.s4}</div>
                                        <div class="text-[9px] text-gray-400 uppercase tracking-widest font-bold">${p.stats.l4}</div>
                                    </div>
                                </div>

                                <!-- Last 3 games -->
                                <div class="flex-grow">
                                    <div class="text-[10px] text-gray-500 uppercase font-bold mb-2">Last 3 Games</div>
                                    <div class="space-y-2">
                                        ${p.games.map(g => `
                                            <div class="flex justify-between items-center bg-white/5 p-2 rounded text-xs">
                                                <span class="text-gray-300">${g.opp}</span>
                                                <span class="text-white font-bold">${g.stat}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- Download button -->
                                <button onclick="event.stopPropagation(); downloadCard('${p.id}', this)"
                                        class="mt-4 w-full bg-[#0071e3] hover:bg-[#005bb5] text-white py-2 rounded font-bold text-xs tracking-wide transition-colors">
                                    DOWNLOAD CARD
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
                `;
            });

            grid.innerHTML = html;
        }

        function downloadCard(id, btn) {
            const cardEl = document.getElementById('card-inner-' + id);
            btn.innerHTML = 'GENERATING...';
            html2canvas(cardEl, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
                const link = document.createElement('a');
                link.download = id + '_Godspeed_Card.png';
                link.href = canvas.toDataURL();
                link.click();
                btn.innerHTML = 'DOWNLOAD CARD';
            });
        }

        window.onload = renderCards;
    </script>

</body>
</html>
