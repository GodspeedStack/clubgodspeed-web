<!DOCTYPE html>
<html>
<head>
    <!-- Application page. Not for the public index: robots.txt is deliberately
         left permissive so crawlers can read this tag; a Disallow would hide it
         and the URL could still be indexed from an inbound link. -->
    <meta name="robots" content="noindex,nofollow">
  <style>
    body { font-family: sans-serif; padding: 40px; }
  </style>
</head>
<body>
  <h1>Widget Isolation Test</h1>
  <div id="dues-transparency-root"></div>
  
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error("BOOM ERROR CAUGHT:", msg);
      if (error && error.stack) console.error(error.stack);
    };
    window.addEventListener('unhandledrejection', function(event) {
      console.error("UNHANDLED PROMISE REJECTION:", event.reason);
    });
  </script>
  <link rel="stylesheet" href="/build/style.css">
  <script src="/build/dues-widget.js"></script>
    <script src="mobile-menu.js"></script>
</body>
</html>
