<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Schedule | Godspeed Basketball</title>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Embedded Button Visibility Override */
        .calendar-controls .btn-secondary {
            color: #111 !important;
            background: #ffffff !important;
            border: 1px solid #d1d5db !important;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
            font-weight: 600 !important;
            transition: all 0.2s ease !important;
        }
        .calendar-controls .btn-secondary:hover {
            background: #f3f4f6 !important;
            border-color: #9ca3af !important;
        }
        
        /* Calendar Specific Styles */
        .calendar-container {
            padding: 8rem 5% 5rem 5%;
            min-height: 100vh;
            background: #fbfbfd;
            font-family: 'Inter', sans-serif;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .calendar-header {
            text-align: center;
            margin-bottom: 4rem;
            position: relative;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            /* gap: 1px; Removed for border-based grid */
            background: rgba(255, 255, 255, 0.85);
            /* Exact feature-card background */
            backdrop-filter: blur(24px);
            /* Exact feature-card fuzz */
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            /* Exact feature-card border */
            border-radius: 24px;
            /* Exact feature-card radius */
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            /* Exact feature-card shadow */
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
        }

        /* New Integrated Header */
        .calendar-header-cell {
            grid-column: 1 / -1;
            background: transparent;
            /* Let glass shine through */
            /* Keep pattern if desired, or remove to strictly match blank cards. User liked pattern previously, but "exactly like cards" might imply no pattern. I'll keep the pattern but make it subtle as it was part of the card look in index? No, index cards don't have patterns. Removing pattern to be "exactly" like cards. */
            padding: 2rem 2rem 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Re-adding pattern as a separate class if needed, but removing for "exactly like cards" request base */

        .month-title {
            font-family: 'Inter', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1d1d1f;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .year-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 1.25rem;
            color: #86868b;
            font-weight: 500;
            margin-top: 0.2rem;
        }

        .calendar-controls {
            display: flex;
            gap: 0.5rem;
        }

        /* The stat pills are injected as inline-styled spans. Without this they
           shrink under pressure and break mid-word ("300 / PRACTICE / HOURS"). */
        #calculated-hours span {
            white-space: nowrap;
        }

        /* ── Mobile header ──────────────────────────────────────────────────
           .calendar-header-cell is a single non-wrapping flex row, so on a
           phone the title, the stat pills and the four control buttons all
           competed for one line: the pills broke mid-word and the Sync button
           and month arrows ran off the right edge with no way to reach them.
           Stack the header on small screens. Desktop is untouched. */
        @media (max-width: 767px) {
            .calendar-header-cell {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                padding: 1.5rem 1.25rem 1rem;
            }

            .month-title {
                font-size: 2rem;
            }

            .year-subtitle {
                font-size: 1.05rem;
            }

            #calculated-hours {
                flex-wrap: wrap;
                gap: 6px !important;
                font-size: 0.8rem !important;
            }

            /* Measured at 390px: the four buttons need 265px and the header
               column gives 262.6px, so the last arrow wrapped alone. Tightening
               the gap and the button padding brings the row to ~247px. */
            .calendar-controls {
                flex-wrap: wrap;
                gap: 0.4rem;
            }

            /* Sized to content, never stretched: a grown button wraps alone
               onto a full-width row and reads as a broken layout. */
            .calendar-controls .btn-secondary {
                flex: 0 1 auto;
                justify-content: center;
                white-space: nowrap;
                padding: 0.5rem 0.8rem !important;
            }
        }

        /* Import Tool in Header */
        .header-import {
            margin-top: 1rem;
        }

        .calendar-day-header {
            background: transparent;
            padding: 1.25rem 1rem;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: #86868b;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Remove right border from the last header in the row */
        .calendar-grid .calendar-day-header:nth-child(8) {
            border-right: none;
        }

        .calendar-day {
            background: transparent;
            min-height: 160px;
            /* Taller cells */
            padding: 1rem;
            position: relative;
            transition: background 0.2s;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Remove right border from the last column of days */
        .calendar-grid .calendar-day:nth-child(7n + 8) {
            border-right: none;
        }

        /* Remove bottom border from the last row of days */
        /* This requires knowing the total number of days, or using a more complex selector */
        /* For now, we'll leave the bottom border on all days, as the outer grid border will cover it */

        .calendar-day:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        /* Mobile List View */
        .calendar-list-view {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            padding: 1rem;
        }

        .calendar-list-container {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 70vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .calendar-list-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .calendar-list-item:active {
            transform: scale(0.98);
            background: #f5f5f7;
        }

        .calendar-list-item.today {
            border-left: 3px solid #2563eb;
        }

        .list-item-date {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 50px;
        }

        .list-item-day {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1d1d1f;
            line-height: 1;
        }

        .list-item-weekday {
            font-size: 0.85rem;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .list-item-content {
            flex: 1;
        }

        .list-item-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 0.25rem;
        }

        .list-item-meta {
            font-size: 0.95rem;
            color: #86868b;
        }

        .list-item-indicator {
            width: 4px;
            height: 100%;
            border-radius: 2px;
            min-height: 40px;
        }

        .calendar-list-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: #86868b;
            font-size: 1.05rem;
        }

        @media (max-width: 767px) {
            .calendar-grid {
                display: none !important;
            }
            
            .calendar-list-view {
                display: block !important;
            }
        }

        @media (min-width: 768px) {
            .calendar-list-view {
                display: none !important;
            }
        }

        .day-number {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 0.5rem;
            display: inline-block;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            border-radius: 50%;
        }

        .day-number.today {
            background: #2563eb;
            color: white;
        }

        .day-number.muted {
            color: #ccc;
        }

        .event-pill {
            display: block;
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            line-height: 1.4;
            letter-spacing: -0.01em;
            position: relative;
            overflow: hidden;
        }

        .event-pill:hover {
            transform: translateY(-1px);
        }

        .event-tournament {
            background: #1d1d1f;
            /* Slightly softer black */
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .event-practice {
            background: #ffffff;
            color: #1d1d1f;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }

        .event-team-practice {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 113, 227, 0.25);
            /* Glow shadow */
        }

        .event-mandatory-skills {
            background: #ffffff;
            color: #2563eb;
            border: 1.5px solid #2563eb;
            box-shadow: 0 2px 5px rgba(0, 113, 227, 0.1);
            font-weight: 700;
            /* Extra weight for mandatory */
        }

        .event-skills {
            background: #ffffff;
            color: #2563eb;
            border: 1px solid rgba(0, 113, 227, 0.3);
            box-shadow: 0 2px 5px rgba(0, 113, 227, 0.05);
        }

        .event-training {
            background: #dcfce7;
            /* Light Green */
            color: #166534;
            /* Dark Green */
            border: 1px solid #bbf7d0;
            box-shadow: 0 2px 5px rgba(22, 101, 52, 0.05);
            font-weight: 600;
        }

        /* Import Section */
        .import-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 3rem;
            border: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
        }

        .import-input {
            flex-grow: 1;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        /* Float Card Animation */
        .float-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2000;
            overflow: hidden;
            /* Ensure content clips to border radius */
        }

        .float-card.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        .overlay-dim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1500;
        }

        .overlay-dim.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Sync Modal */
        .sync-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 2000;
        }

        .sync-modal.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        .sync-btn-option {
            display: block;
            width: 100%;
            padding: 1rem;
            margin-bottom: 0.8rem;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            background: white;
            color: #1d1d1f;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sync-btn-option:hover {
            background: #f5f5f7;
            transform: scale(1.02);
        }

        /* ── This-week game notice ──────────────────────────────────────────
           Additive strip above the calendar. Does not touch the grid, the list
           view, or the month navigation. */
        .week-notice {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0 0 16px;
            padding: 14px 18px;
            border-radius: 12px;
            border-left: 4px solid #2563eb;
            background: #f5f5f7;
            color: #1d1d1f;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .week-notice strong {
            font-weight: 700;
        }

        .week-notice span {
            color: #6e6e73;
        }

        /* No games is the state parents need to spot at a glance, so it gets
           the stronger treatment: red rule, red pill. */
        .week-notice-none {
            background: #fdf1f0;
            border-left-color: #c0392b;
        }

        .week-notice-some {
            background: #f5f5f7;
            border-left-color: #d2d2d7;
        }

        /* Per-team breakdown, used when the family spans more than one team. */
        .week-notice-multi {
            flex-direction: column;
            align-items: stretch;
            gap: 5px;
        }

        .week-notice-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .week-notice-row strong {
            flex: 0 0 auto;
        }

        /* Status pill. The idle state is the one a parent needs to catch from
           across the room, so it is the only one carrying colour. */
        .week-notice .week-notice-pill {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            line-height: 1.5;
        }

        .week-notice .week-notice-pill-none {
            background: #c0392b;
            color: #ffffff;
        }

        .week-notice .week-notice-pill-some {
            background: rgba(0, 0, 0, 0.06);
            color: #1d1d1f;
        }

        .week-notice-range {
            margin-top: 3px;
            font-size: 0.85rem;
            color: #86868b;
        }

        @media (max-width: 480px) {
            .week-notice-row {
                flex-direction: column;
                gap: 0;
            }

        }

        @media (max-width: 767px) {
            .week-notice {
                margin: 0 0 12px;
                padding: 12px 14px;
                font-size: 0.9rem;
            }
        }
    </style>
    <link rel="stylesheet" href="mobile-fixes.css">
</head>

<body>

                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">

                            <polyline points="7 10 12 15 17 10"></polyline>

                    <button class="btn-secondary" onclick="prevMonth()"

            <div id="calendarListBody" class="calendar-list-container">

    <script type="module" src="backend.js"></script>
    <script>
        // Calendar State
        let currentDate = new Date(); // Start at current real date
        let enrolledPrograms = []; // Programs the athlete is enrolled in
        let filterAthleteId = null; // Current athlete filter
        let filterTeamIds = null; // Signed-in family's team ids; when set, games are scoped to these teams
        let externalEvents = []; // External events injected from parent

        // Listen for filter and injection messages from parent portal
        window.addEventListener('message', (event) => {
            if (event.data) {
                if (event.data.type === 'filterByAthlete') {
                    filterAthleteId = event.data.athleteId;
                    if (window.parent && window.parent.trainingEnrolledPrograms) {
                        enrolledPrograms = window.parent.trainingEnrolledPrograms;
                    }
                    renderCalendar();
                } else if (event.data.type === 'setTeams') {
                    filterTeamIds = (Array.isArray(event.data.teamIds) && event.data.teamIds.length) ? event.data.teamIds : null;
                    renderCalendar();
                } else if (event.data.type === 'injectEvents') {
                    // Inject external events (e.g. Purchased Training)
                    // event.data.events should be an array of event objects
                    if (Array.isArray(event.data.events)) {
                        externalEvents = event.data.events;
                        renderCalendar();
                    }
                }
            }
        });

        // Load enrolled programs from parent window if available
        if (window.parent && window.parent.trainingEnrolledPrograms) {
            enrolledPrograms = window.parent.trainingEnrolledPrograms;
        }

        // Configuration
        const RECURRING_EVENTS = {
            2: { // Tuesday
                type: 'team-practice',
                title: 'TEAM PRACTICE',
                time: '6:00 PM - 8:00 PM',
                loc: 'Green Valley Ranch',
                desc: 'Doors 5:55 PM. Regular team practice.',
                pillClass: 'event-team-practice',
                color: '#2563eb',
                textColor: 'light',
                duration: 2
            },
            4: { // Thursday
                type: 'team-practice',
                title: 'TEAM PRACTICE',
                time: '6:00 PM - 8:00 PM',
                loc: 'Green Valley Ranch',
                desc: 'Doors 5:55 PM. Regular team practice.',
                pillClass: 'event-team-practice',
                color: '#2563eb',
                textColor: 'light',
                duration: 2
            },
            5: { // Friday
                type: 'team-practice',
                title: 'TEAM PRACTICE',
                time: '6:00 PM - 8:00 PM',
                loc: 'Green Valley Ranch',
                desc: 'Doors 5:55 PM. Regular team practice.',
                pillClass: 'event-team-practice',
                color: '#2563eb',
                textColor: 'light',
                duration: 2
            }
        };

        const MONTH_NAMES = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

        function getEventsForDate(date) {
            const dateStr = date.toISOString().split('T')[0];
            const dayOfWeek = date.getDay(); // 0=Sun, 1=Mon...

            let events = [];

            // 1. External Events (Injected)
            const daysExternal = externalEvents.filter(e => e.date === dateStr);
            if (daysExternal.length > 0) {
                events = events.concat(daysExternal);
            }

            // 2. Check Specific Overrides first
            if (SPECIFIC_EVENTS[dateStr] === 'SKIP') return [];

            if (SPECIFIC_EVENTS[dateStr] && Array.isArray(SPECIFIC_EVENTS[dateStr])) {
                const skipRecurring = SPECIFIC_EVENTS[dateStr].some(e => e.skipRecurring);
                SPECIFIC_EVENTS[dateStr].forEach(ev => {
                    if (ev.skipRecurring) return; // Skip the marker itself
                    if (ev.recurring) {
                        // Include recurring
                        const recurring = RECURRING_EVENTS[dayOfWeek];
                        if (recurring) {
                            if (!recurring.startDate || date >= new Date(recurring.startDate)) {
                                events.push(recurring);
                            }
                        }
                    } else {
                        events.push(ev);
                    }
                });
                // Logic above allows mixing specific + recurring if specific array has {recurring:true}
                if (skipRecurring || (!SPECIFIC_EVENTS[dateStr].some(e => e.recurring) && events.length > 0)) {
                    return filterEventsByEnrollment(events);
                }
            }

            // Fallback to Recurring
            if (RECURRING_EVENTS[dayOfWeek]) {
                const recurring = RECURRING_EVENTS[dayOfWeek];
                // Check if recurring event has a start date requirement
                if (!recurring.startDate || date >= new Date(recurring.startDate)) {
                    events.push(recurring);
                }
            }

            return filterEventsByEnrollment(events);
        }

        /**
         * Filter events based on athlete's enrolled programs
         * If enrolledPrograms is empty, show all events
         */
        function filterEventsByEnrollment(events) {
            // Team scoping first: any event carrying a teamId shows only to that team's families.
            // Events with no teamId (program-wide practices, tournaments) stay visible to all.
            if (filterTeamIds && filterTeamIds.length) {
                events = events.filter(function (event) {
                    return !event.teamId || filterTeamIds.includes(event.teamId);
                });
            }
            // If no enrollment filter is set, show all (team-scoped) events
            if (!filterAthleteId && enrolledPrograms.length === 0) {
            return events;
            }

            // If filter is set but no enrolled programs, show nothing
            if (filterAthleteId && enrolledPrograms.length === 0) {
                return [];
            }

            // Filter events based on program type matching enrolled programs
            return events.filter(event => {
                // Map event types to program IDs
                const eventTypeToProgram = {
                    'skills': 'skills-program',
                    'mandatory-skills': 'skills-program',
                    'team-practice': 'team-practice',
                    'practice': 'team-practice'
                };

                const programId = eventTypeToProgram[event.type];

                // If event type doesn't map to a program, show it (e.g., games)
                if (!programId) return true;

                // Check if athlete is enrolled in this program type
                return enrolledPrograms.some(ep =>
                    ep.includes(programId) ||
                    ep.includes(event.type) ||
                    ep === programId
                );
            });
        }

        // ── This-week game notice ──────────────────────────────────────────
        // Parents kept asking whether their team plays this week, and a month
        // grid does not answer that: a 5th grade family looking at a month with
        // six game pills on it cannot tell that all six belong to the 6th.
        //
        // The notice is anchored to the REAL current week, never to the month
        // being browsed. Paging ahead to December must not tell a parent there
        // are "no games this week" for a week that has not happened.
        //
        // Counting goes through getEventsForDate, which is the same call the
        // grid renders from, so the notice can never disagree with what is on
        // screen: team and grade scoping, practice cancellations (SKIP) and the
        // enrolment filter are all already applied by the time we count.
        function currentWeekBounds() {
            const t = new Date();
            // Monday-start week. getDay() is 0 for Sunday, so (day + 6) % 7
            // gives days since Monday without a special case.
            const monday = new Date(t.getFullYear(), t.getMonth(), t.getDate() - ((t.getDay() + 6) % 7));
            const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
            return { monday, sunday };
        }

        // Games reach the calendar as type 'game' (hardcoded season results) or
        // type 'tournament' (published calendar_events and team schedule rows).
        // Practice, skills and training are never games.
        function isGameEvent(ev) {
            return !!ev && (ev.type === 'game' || ev.type === 'tournament');
        }

        function isPracticeEvent(ev) {
            return !!ev && (ev.type === 'team-practice' || ev.type === 'practice'
                || ev.type === 'skills' || ev.type === 'mandatory-skills');
        }

        // A family with players on two teams is the norm here, not the edge
        // case: the swing players put 19 parent accounts on more than one
        // roster. A single combined count would tell such a parent "2 games
        // this week" while one of their teams sits idle, which is the exact
        // question this notice exists to answer. So when the viewer has more
        // than one team, each team gets its own line.
        function shortTeamName(name) {
            return String(name || '').replace(/^Godspeed\s+/i, '').trim() || 'Team';
        }

        function describeGames(count, dayKeys) {
            if (count === 0) return 'no games this week';
            const noun = count === 1 ? 'game' : 'games';
            // Naming the day is only useful while it stays short. Past two
            // distinct days it is noise and the calendar below says it better.
            if (dayKeys.length > 0 && dayKeys.length <= 2) {
                const days = dayKeys.sort().map(k => {
                    const [y, m, d] = k.split('-').map(Number);
                    const dt = new Date(y, m - 1, d);
                    const wd = dt.toLocaleDateString('en-US', { weekday: 'short' });
                    const md = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    return `${wd} ${md}`;
                });
                return `${count} ${noun}, ${days.join(' and ')}`;
            }
            return `${count} ${noun} this week`;
        }

        function renderWeekGameNotice() {
            const el = document.getElementById('weekGameNotice');
            if (!el) return;

            const { monday, sunday } = currentWeekBounds();
            const fmt = (dt) => dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const range = `${fmt(monday)} to ${fmt(sunday)}`;

            // Walk the week once, through the same call the grid renders from.
            const byTeam = {};      // teamId -> { count, days:Set }
            let unattributed = 0;   // visible games carrying no team id
            let games = 0, practices = 0;
            for (let d = new Date(monday); d <= sunday; d.setDate(d.getDate() + 1)) {
                const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                getEventsForDate(new Date(d)).forEach(ev => {
                    if (isPracticeEvent(ev)) practices++;
                    if (!isGameEvent(ev)) return;
                    games++;
                    if (ev.teamId) {
                        if (!byTeam[ev.teamId]) byTeam[ev.teamId] = { count: 0, days: new Set() };
                        byTeam[ev.teamId].count++;
                        byTeam[ev.teamId].days.add(key);
                    } else {
                        unattributed++;
                    }
                });
            }

            const scope = _viewerScope;
            const teams = (scope && scope.resolved && Array.isArray(scope.teams)) ? scope.teams : [];

            // Per-team breakdown, but only once we actually know the teams and
            // there is more than one. One team needs no label, and an
            // unresolved viewer must not be shown a team list we cannot stand
            // behind.
            if (teams.length > 1) {
                let anyIdle = false;
                const rows = teams.map(t => {
                    const hit = byTeam[t.id];
                    const count = hit ? hit.count : 0;
                    if (count === 0) anyIdle = true;
                    const pill = count === 0 ? 'week-notice-pill-none' : 'week-notice-pill-some';
                    const label = count === 0
                        ? 'No games'
                        : describeGames(count, hit ? Array.from(hit.days) : []);
                    return `<div class="week-notice-row"><strong>${shortTeamName(t.name)}</strong>`
                         + `<span class="week-notice-pill ${pill}">${label}</span></div>`;
                });
                if (unattributed > 0) {
                    rows.push('<div class="week-notice-row"><strong>Also this week</strong>'
                            + '<span class="week-notice-pill week-notice-pill-some">'
                            + `${unattributed} ${unattributed === 1 ? 'game' : 'games'} not assigned to a team yet</span></div>`);
                }
                el.className = 'week-notice week-notice-multi '
                             + (anyIdle ? 'week-notice-none' : 'week-notice-some');
                el.innerHTML = rows.join('') + `<div class="week-notice-range">${range}</div>`;
                el.hidden = false;
                return;
            }

            // Single team, or a viewer whose teams never resolved.
            let cls, pill, lead, detail;
            if (games > 0) {
                cls = 'week-notice week-notice-some';
                pill = 'week-notice-pill-some';
                lead = games === 1 ? '1 game this week' : `${games} games this week`;
                detail = `${range}. Times and locations are on the calendar below.`;
            } else if (practices > 0) {
                cls = 'week-notice week-notice-none';
                pill = 'week-notice-pill-none';
                lead = 'No games this week';
                // Only promised because this week's practice pills survived the
                // cancellation filter above.
                detail = `${range}. Practice runs on the regular schedule.`;
            } else {
                cls = 'week-notice week-notice-none';
                pill = 'week-notice-pill-none';
                lead = 'Nothing scheduled this week';
                detail = `${range}. No games and no practice on the calendar.`;
            }

            el.className = cls;
            el.innerHTML = `<span class="week-notice-pill ${pill}">${lead}</span> <span>${detail}</span>`;
            el.hidden = false;
        }

        function renderCalendar() {
            renderWeekGameNotice();

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const isMobile = window.innerWidth < 768;

            // Update Header
            // The grid view and the mobile list view each carry their own header
            // with the SAME id, and getElementById only ever returns the first.
            // The mobile header was therefore never updated and sat on its
            // hardcoded "DECEMBER / 2025 Schedule" placeholder no matter what
            // month a parent was looking at. Update every match.
            document.querySelectorAll('#monthTitle').forEach(el => {
                el.innerText = MONTH_NAMES[month];
            });
            document.querySelectorAll('#yearSubtitle').forEach(el => {
                el.innerText = `${year} Schedule`;
            });

            const grid = document.getElementById('calendarGridBody');
            const listContainer = document.getElementById('calendarListBody');

            // Stats Calculation (Season Total)
            const stats = calculateSeasonStats(year, month);
            // Check Role from URL to conditionally hide hours for parents
            const urlParams = new URLSearchParams(window.location.search);
            const isParent = urlParams.get('role') === 'parent';

            const hoursContainers = document.querySelectorAll('#calculated-hours');
            hoursContainers.forEach(container => {
                if (!isParent) {
                    container.innerHTML = `
                        <span style="background: rgba(37,99,235,0.1); color: #2563eb; padding: 4px 10px; border-radius: 99px;">${stats.practice} Practice Hours</span>
                        <span style="background: rgba(0,0,0,0.05); color: #1d1d1f; padding: 4px 10px; border-radius: 99px;">${stats.game} Game Hours</span>
                    `;
                } else {
                    container.innerHTML = '';
                }
            });

            // Mobile: Render as list
            if (isMobile && listContainer) {
                renderCalendarList(year, month, listContainer);
                document.querySelector('.calendar-grid').style.display = 'none';
                document.querySelector('.calendar-list-view').style.display = 'block';
                return;
            }

            // Desktop: Render as grid
            if (listContainer) {
                document.querySelector('.calendar-list-view').style.display = 'none';
            }
            document.querySelector('.calendar-grid').style.display = 'grid';
            grid.innerHTML = ''; // Clear

            // Days Generation
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // Pad start
            let startPadding = firstDay.getDay(); // 0 is Sunday
            // If we want consistent rows, we just fill empty divs
            for (let i = 0; i < startPadding; i++) {
                const pad = document.createElement('div');
                pad.className = 'calendar-day';
                grid.appendChild(pad);
            }

            // Days
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day';

                const currentDayDate = new Date(year, month, i);
                const isToday = (currentDayDate.toDateString() === new Date().toDateString());

                // Day Number
                const numSpan = document.createElement('span');
                numSpan.className = `day-number ${isToday ? 'today' : ''}`;
                numSpan.innerText = i;
                cell.appendChild(numSpan);

                // Events
                const events = getEventsForDate(currentDayDate);
                events.forEach(ev => {
                    const pill = document.createElement('span');
                    if (ev.style) {
                        pill.className = ev.pillClass;
                        pill.style = ev.style;
                        pill.innerText = ev.title;
                    } else {
                        pill.className = `event-pill ${ev.pillClass}`;
                        pill.innerText = ev.title;

                        pill.onclick = () => openEvent(

                            ev.time || 'All Day',
                            ev.loc || 'TBD',
                            ev.desc || '',
                            ev.color,
                            ev.textColor
                        );
                    }
                    cell.appendChild(pill);
                });

                grid.appendChild(cell);

        function renderCalendarList(year, month, container) {
            container.innerHTML = '';

            const today = new Date();
            
            // Collect all events for the month
            const eventsByDate = [];
            for (let i = 1; i <= lastDay.getDate(); i++) {
                const currentDayDate = new Date(year, month, i);
                const events = getEventsForDate(currentDayDate);
                if (events.length > 0) {
                    eventsByDate.push({
                        date: currentDayDate,
                        day: i,
                        events: events,
                        isToday: currentDayDate.toDateString() === today.toDateString()
                    });

            if (eventsByDate.length === 0) {

        function calculateSeasonStats(targetYear, targetMonth) {
            // Calculate season stats dynamically from start (Sept 25, 2025)
            let practice = 0;
            let game = 0;

            // Iterate from Sept 25, 2025 to End of Target Month
            let iterDate = new Date(2025, 8, 25);
            let endDate = new Date(targetYear, targetMonth + 1, 0);

            while (iterDate <= endDate) {
                const evs = getEventsForDate(iterDate);
                evs.forEach(e => {
                    if (e.duration) {
                        if (e.type === 'game' || e.type === 'tournament') game += e.duration;
                        else practice += e.duration;
                    }
                });
                iterDate.setDate(iterDate.getDate() + 1);
            }
            return { practice, game };
        }

        function generateSeasonICS() {
            let ics = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Godspeed//NONSGML v1.0//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n";

            // Loop from Dec 1, 2025 to April 30, 2026
            let iterDate = new Date(2025, 11, 1);
            const endDate = new Date(2026, 3, 30); // April 30

            while (iterDate <= endDate) {
                const events = getEventsForDate(iterDate);
                events.forEach(e => {
                    // Skip INFO pills, only real events
                    if (e.type === 'info') return;

                    const dateStr = iterDate.toISOString().replace(/-/g, '').split('T')[0];
                    let startTime = '090000'; // Default
                    let endTime = '100000';

                    // Parse time helper
                    if (e.time && e.time.includes(':')) {
                        // Very basic parser for 6:00 PM
                        try {
                            const [timeRange, ampm] = e.time.split('M')[0].split(' '); // simple hack
                            // Better: use specific data in config if available.
                            // For simplicity, we'll try to guess start time or default
                            // 6:00 PM -> 180000
                            if (e.time.includes('6:00 PM')) { startTime = '180000'; endTime = '190000'; }
                            if (e.time.includes('6:00 PM - 8:00 PM')) { startTime = '180000'; endTime = '200000'; }
                            if (e.time.includes('10:00 AM')) { startTime = '100000'; endTime = '110000'; }
                            if (e.time.includes('11:00 AM')) { startTime = '110000'; endTime = '120000'; }
                            if (e.time.includes('1:00 PM')) { startTime = '130000'; endTime = '140000'; }
                        } catch (err) { }
                    }

                    ics += "BEGIN:VEVENT\n";
                    ics += `DTSTART;TZID=America/Denver:${dateStr}T${startTime}\n`;
                    ics += `DTEND;TZID=America/Denver:${dateStr}T${endTime}\n`;
                    ics += `SUMMARY:${e.fullTitle || e.title}\n`;
                    ics += `DESCRIPTION:${e.desc || ''}\n`;
                    ics += `LOCATION:${e.loc || 'TBD'}\n`;
                    ics += "END:VEVENT\n";
                });
                iterDate.setDate(iterDate.getDate() + 1);
            }

            ics += "END:VCALENDAR";
            return ics;
        }

        // ── Load published events from Supabase and merge into SPECIFIC_EVENTS ──
        function fmtTime(t) {
            if (!t) return 'TBD';
            var p = String(t).split(':');
            var h = parseInt(p[0], 10);
            var m = p[1] || '00';
            var ap = h >= 12 ? 'PM' : 'AM';
            var hh = h % 12; if (hh === 0) hh = 12;
            return hh + ':' + m + ' ' + ap;
        }

        // Season window. These queries used to carry baked-in dates
        // (2026-03-01, 2025-12-01), which silently start hiding events once the
        // season rolls past them. A rolling twelve-month lookback covers at
        // least as much as those literals did and never goes stale.
        function calendarWindowStartISO() {
            const d = new Date();
            d.setFullYear(d.getFullYear() - 1);
            return d.toISOString().split('T')[0];
        }

        // Parents see program-wide events plus their own team(s). Staff see all.
        // FAILS CLOSED: an unresolved viewer sees only untagged program-wide
        // events, never another team's games.
        let _viewerScope = null;
        async function getViewerScope() {
            if (_viewerScope) return _viewerScope;
            const scope = { isStaff: false, teamIds: [], teams: [], grades: [], resolved: false, accessToken: null };
            try {
                const { createClient } = window.supabase;
                const sb = createClient(

                );
                const { data: { session } } = await sb.auth.getSession();
                const user = session && session.user;
                if (user) {
                    scope.accessToken = session.access_token || null;
                    const { data: prof } = await sb.from('profiles')
                        .select('role').eq('id', user.id).maybeSingle();
                    const role = prof && prof.role;
                    scope.isStaff = (role === 'director' || role === 'coach' || role === 'founder');
                    const { data: teamRows } = await sb.rpc('get_my_team_ids');
                    scope.teamIds = (teamRows || [])
                        .map(r => (typeof r === 'string') ? r : (r.get_my_team_ids || Object.values(r)[0]))
                        .filter(Boolean);
                    // Most team-specific events carry grade_level but no team_id,
                    // so team-id scoping alone leaks them. Derive grades from the
                    // family's team names: "Godspeed 4th/5th Grade" -> 4th, 5th.
                    if (scope.teamIds.length) {
                        const { data: teamRecs } = await sb.from('teams')
                            .select('id,name').in('id', scope.teamIds);
                        const found = new Set();
                        (teamRecs || []).forEach(t => {
                            (String(t.name || '').match(/\d+(?:st|nd|rd|th)/gi) || [])
                                .forEach(g => found.add(g.toLowerCase()));
                        });
                        scope.grades = Array.from(found);
                        // Names, not just ids: the this-week notice reports per
                        // team, and most families here span two teams because of
                        // the swing players.
                        scope.teams = (teamRecs || [])
                            .map(t => ({ id: t.id, name: t.name || '' }))
                            .sort((a, b) => a.name.localeCompare(b.name));
                    }
                    scope.resolved = true;
                }
            } catch (e) {
                console.warn('Calendar scope unresolved; showing program-wide events only.', e);
            }
            _viewerScope = scope;
            return scope;
        }

        // This calendar only ever fetches competitive events
        // (tournament, season, game, camp). Every one of those belongs to a
        // single team, so an event carrying neither a team nor a grade cannot be
        // attributed and is withheld rather than shown to every family. There is
        // no combined team this season, so 'both' is treated as unattributed too.
        function visibleToViewer(teamId, scope, gradeLevel) {
            if (scope.isStaff) return true;                          // staff see every team
            if (teamId) return scope.teamIds.indexOf(teamId) !== -1; // own team only
            if (!gradeLevel || gradeLevel === 'both') return false;  // cannot attribute: withhold

        async function refreshCalendarData() {
            const startTime = performance.now();
            CalendarSyncConfig.updateSyncBadge('syncing');

            try {
                // Clear all dynamic event data, keep hardcoded events
                const dateKeys = Object.keys(SPECIFIC_EVENTS);
                dateKeys.forEach(key => {
                    if (Array.isArray(SPECIFIC_EVENTS[key])) {
                        SPECIFIC_EVENTS[key] = SPECIFIC_EVENTS[key].filter(ev =>
                            ev.type !== 'tournament' && ev._source !== 'team_schedule'
                        );
                    }
                });

                // Reload from all sources with timing
                // Published events + cancellations first, then schedule dedup
                const loadStart = performance.now();
                await Promise.all([
                    loadPublishedEvents(),
                    loadPracticeCancellations()
                ]);
                await loadScheduledTournaments();
                const loadDuration = performance.now() - loadStart;

                CalendarSyncConfig.logQuery('refreshData', Math.round(loadDuration));

                // Re-render calendar
                renderCalendar();

                const totalDuration = performance.now() - startTime;
                CalendarSyncConfig.recordSync(Math.round(totalDuration), true);
                console.log(`✓ Calendar refreshed in ${Math.round(totalDuration)}ms`);
            } catch (err) {
                const duration = performance.now() - startTime;
                CalendarSyncConfig.logQuery('refreshData', Math.round(duration), 0, err);
                CalendarSyncConfig.recordSync(Math.round(duration), false);
                console.error('Failed to refresh calendar data:', err);
            }
        }
